<!doctype html>
<html lang="{{ site:short_locale }}" class="h-full">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>{{ (title ?? site:name) | sanitize }}</title>
    {{ vite src="resources/js/site.js|resources/css/site.css" }}
</head>
<body class="h-full bg-zinc-950 text-zinc-100 antialiased font-sans">

    <header class="fixed top-0 inset-x-0 z-40 flex items-center justify-between px-6 py-4 bg-zinc-950/80 backdrop-blur-sm border-b border-zinc-900">
        <a href="/" class="text-sm font-semibold tracking-widest uppercase text-zinc-100 hover:text-white transition-colors">
            {{ site:name }}
        </a>
        <nav class="flex items-center gap-6 text-sm text-zinc-400">
            <a href="/galeries" class="hover:text-zinc-100 transition-colors">Galeries</a>
        </nav>
    </header>

    <main class="pt-16">
        {{ template_content }}
    </main>

</body>
</html>
